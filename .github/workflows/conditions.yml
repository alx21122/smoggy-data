name: conditions

on:
  workflow_dispatch:
  schedule:
    - cron: '40 2,8,14,20 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: |
          pip install ecmwf-opendata cfgrib xarray numpy pillow eccodes
          python -m cfgrib selfcheck

      - name: build PNG
        run: python make_conditions.py

      - name: commit
        run: |
          git config user.name "smoggy-bot"
          git config user.email "bot@smoggyapp.com"
          git add conditions
          git commit -m "conditions" || echo "no change"
          git push || echo "nothing to push"
