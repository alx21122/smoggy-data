name: aq

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build snapshot
        run: python make_aq.py
      - name: commit
        run: |
          git config user.name "smoggy-bot"
          git config user.email "bot@smoggyapp.com"
          git add aq-forecast
          git commit -m "aq snapshot" || echo "no change"
          git push || echo "nothing to push"
