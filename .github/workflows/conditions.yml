name: conditions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ecmwf-opendata cfgrib xarray numpy pillow eccodes
          python -m eccodes selfcheck
          python -m cfgrib selfcheck

      - name: build PNG
        run: python make_conditions.py

      - name: commit
        run: |
          git config user.name  "smoggy-bot"
          git config user.email "bot@smoggyapp.com"
          git add conditions
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "condi
