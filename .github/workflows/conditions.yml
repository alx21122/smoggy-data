name: conditions

on:
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * *'
    - cron: '40 8 * * *'
    - cron: '40 14 * * *'
    - cron: '40 20 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: |
          pip install ecmwf-opendata cfgrib xarray numpy pillow eccodes
          python -m cfgrib selfcheck

      # Alex 28/08/26: to github.event.schedule periexei AKRIVOS poio apo ta
      # 4 parapano cron slots (xorista TWRA) trigger-are auto to run -- to
      # metatrepoume se EXPECTED_CYCLE_HOUR gia to make_conditions.py, WSTE
      # na MIN exartatai KATHOLOU apo poso kathisterise o runner. Manual
      # (workflow_dispatch) den exei schedule -> kena, to script peftei
      # ston diko tou wall-clock fallback (AMETABLITO, idio me prin).
      - name: resolve expected cycle
        run: |
          case "${{ github.event.schedule }}" in
            "40 2 * * *")  echo "EXPECTED_CYCLE_HOUR=0"  >> "$GITHUB_ENV" ;;
            "40 8 * * *")  echo "EXPECTED_CYCLE_HOUR=6"  >> "$GITHUB_ENV" ;;
            "40 14 * * *") echo "EXPECTED_CYCLE_HOUR=12" >> "$GITHUB_ENV" ;;
            "40 20 * * *") echo "EXPECTED_CYCLE_HOUR=18" >> "$GITHUB_ENV" ;;
            *) echo "::notice:: no scheduled-cron match (manual/other trigger) - make_conditions.py falls back to its own nearest-slot calculation" ;;
          esac

      - name: build PNG
        run: python make_conditions.py

      - name: commit
        run: |
          git config user.name "smoggy-bot"
          git config user.email "bot@smoggyapp.com"

          # AUTO: panta stage. An ftasame edo, to "build PNG" step idi
          # petyxe (an to AUTO loop skoupsei, to script exit != 0, kai
          # auto to step den trexei kan -- default GitHub Actions
          # symperifora, kamia allagi xreiazetai edo).
          git add conditions/auto

          # FORECAST: stage MONO se rita "success". Se opoiodipote allo
          # status (failure / unrecovered / missing file) -> checkout piso
          # sto HEAD PRIN apo opoiodipote add, ostu o,ti mess emeine ston
          # ephemeral disk na MIN ftasei pote se commit.
          status=$(cat .forecast_status 2>/dev/null || echo "failure")
          if [ "$status" = "success" ]; then
            git add conditions/forecast
          else
            git checkout -- conditions/forecast 2>/dev/null || true
            echo "::warning:: forecast status=$status - conditions/forecast reset to HEAD, not committed"
          fi

          git commit -m "conditions" || echo "no change"
          git push || echo "nothing to push"
